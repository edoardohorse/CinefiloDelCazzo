name: Build and Deploy Frontend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '24'  # or your preferred Node.js version

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm i  # Use npm ci for clean install
    
    - name: Build project
      run: npm run build:frontend  # This creates the dist/ folder
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-folder
        path: frontend/dist/
        retention-days: 7
